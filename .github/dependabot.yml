version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    # Ensure security patches are not blocked
    open-pull-requests-limit: 10
    # Add 8-day cooldown to prevent supply chain attacks through compromised packages
    cooldown:
      default-days: 8

  # Monitor GitHub Actions even though workflows may not exist yet
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    cooldown:
      default-days: 8
